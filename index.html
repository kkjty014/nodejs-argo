<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静态网站示例</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#333}
header{background:#2563eb;color:white;padding:60px 20px;text-align:center}
main{max-width:1000px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin:20px 0}
footer{text-align:center;padding:20px;color:#666}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>欢迎来到我的静态网站</h1>
<p>这是一个单文件 index.html 示例页面</p>
</header>

<main>
<div class="card">
<h2>关于</h2>
<p>此页面无需后端，可直接部署到任何静态托管服务。</p>
</div>

<div class="card">
<h2>功能</h2>
<ul>
<li>响应式布局</li>
<li>纯 HTML + CSS</li>
<li>易于修改和扩展</li>
</ul>
</div>

<div class="card">
<h2>联系</h2>
<button onclick="alert('感谢访问！')">点击测试</button>
</div>
</main>

<footer>
© 2026 Static Website Demo
</footer>
</body>
</html>
